name: CI/CD

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/laporinaja?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy-staging:
    name: Deploy staging (development)
    if: github.ref == 'refs/heads/development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Verify staging deploy hooks are configured
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          RENDER_WEB_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: |
          if [[ -z "$RENDER_API_DEPLOY_HOOK" || -z "$RENDER_WEB_DEPLOY_HOOK" ]]; then
            echo "::error::Add RENDER_API_DEPLOY_HOOK and RENDER_WEB_DEPLOY_HOOK in GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy staging API
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$RENDER_API_DEPLOY_HOOK"

      - name: Deploy staging frontend
        env:
          RENDER_WEB_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$RENDER_WEB_DEPLOY_HOOK"

  deploy-production:
    name: Deploy production (main)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check production deploy hooks
        id: hooks
        env:
          RENDER_API_DEPLOY_HOOK_PROD: ${{ secrets.RENDER_API_DEPLOY_HOOK_PROD }}
          RENDER_WEB_DEPLOY_HOOK_PROD: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_PROD }}
        run: |
          if [[ -n "$RENDER_API_DEPLOY_HOOK_PROD" && -n "$RENDER_WEB_DEPLOY_HOOK_PROD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production deploy hooks belum diset. Deploy production dilewati."
          fi

      - name: Deploy production API
        if: steps.hooks.outputs.configured == 'true'
        env:
          RENDER_API_DEPLOY_HOOK_PROD: ${{ secrets.RENDER_API_DEPLOY_HOOK_PROD }}
        run: curl --fail --silent --show-error --request POST "$RENDER_API_DEPLOY_HOOK_PROD"

      - name: Deploy production frontend
        if: steps.hooks.outputs.configured == 'true'
        env:
          RENDER_WEB_DEPLOY_HOOK_PROD: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_PROD }}
        run: curl --fail --silent --show-error --request POST "$RENDER_WEB_DEPLOY_HOOK_PROD"
