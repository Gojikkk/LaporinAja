databases:
  - name: laporinaja-staging-db
    databaseName: laporinaja_staging
    user: laporinaja_staging
    plan: free
    region: singapore

services:
  - type: web
    name: laporinaja-staging-api
    runtime: docker
    plan: free
    autoDeployTrigger: off
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: laporinaja-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://laporinaja-staging-web.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: laporinaja-staging

  - type: web
    name: laporinaja-staging-web
    runtime: static
    autoDeployTrigger: off
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://laporinaja-staging-api.onrender.com/api
      - key: VITE_CSRF_ENDPOINT
        value: /auth/csrf
      - key: VITE_CSRF_HEADER_NAME
        value: X-CSRF-Token
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
